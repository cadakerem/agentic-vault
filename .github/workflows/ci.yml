name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Reject BOM and control characters
        if: runner.os == 'Linux'
        run: |
          ! LC_ALL=C grep -rlP '^\xEF\xBB\xBF|[\x00-\x08\x0B\x0C\x0E-\x1F]' --include='*.ts' --include='*.md' --include='*.json' . --exclude-dir=node_modules
      - name: Type check
        run: npx tsc --noEmit
      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run tests
        run: npm run test
      - name: Build plugin
        run: npm run build
